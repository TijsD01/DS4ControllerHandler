name: Release

# Builds the downloadable Windows app:
#   DS4Handler-Setup-<versie>.exe  installer, installs ViGEmBus/HidHide too when they are missing
#   DS4Handler-<versie>-portable.exe  one exe, no installation (drivers must be installed separately)
#
# The files land on the GitHub Releases page when you:
#   - push a tag like v1.0.0, or
#   - make a release by hand on GitHub (any tag name), or
#   - click "Run workflow" and fill in a tag (an existing release with that tag gets the files).
# "Run workflow" without a tag, or a pull request that touches the packaging, only builds them and
# keeps them as a workflow artifact, without making a release.

on:
  push:
    tags: ['v*']
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag van de release waar de exe-bestanden bij moeten (leeg = alleen bouwen)'
        required: false
        default: ''
  pull_request:
    paths:
      - '.github/workflows/release.yml'
      - 'installer/**'
      - 'src/DS4Handler.App/DS4Handler.App.csproj'

permissions:
  contents: write

jobs:
  package:
    runs-on: windows-latest
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || github.ref }}

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Bepaal versie
        id: version
        shell: pwsh
        run: |
          # Tag to publish to: a pushed tag, a hand-made release, or the "Run workflow" input.
          $tag = "${{ github.event.release.tag_name || inputs.tag }}"
          if (-not $tag -and "${{ github.ref_type }}" -eq "tag") { $tag = "${{ github.ref_name }}" }
          if ($tag -match '^v?(\d+\.\d+\.\d+(-[0-9A-Za-z.-]+)?)$') {
            $v = $Matches[1]
          } elseif ($tag) {
            # A tag that is not a version number (e.g. "release1") still gets a usable version.
            $v = "1.0.${{ github.run_number }}"
          } else {
            $v = "0.0.0-dev.${{ github.run_number }}"
          }
          # Assembly versions only take numbers; drop any "-beta" style suffix there.
          $numeric = ($v -split '-')[0]
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "version=$v" >> $env:GITHUB_OUTPUT
          "numeric=$numeric" >> $env:GITHUB_OUTPUT
          Write-Host "Versie: $v (tag: '$tag')"

      - name: Tests
        run: dotnet test tests/DS4Handler.Core.Tests -c Release

      - name: Publiceer als één exe (zonder losse .NET-installatie)
        shell: pwsh
        run: >
          dotnet publish src/DS4Handler.App -c Release -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -p:DebugType=none
          -p:Version=${{ steps.version.outputs.numeric }}
          -p:InformationalVersion=${{ steps.version.outputs.version }}
          -o build/publish

      - name: Download ViGEmBus- en HidHide-installers
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory -Force build/drivers | Out-Null
          $headers = @{ Authorization = "Bearer $env:GH_TOKEN"; 'User-Agent' = 'ds4handler-release' }
          function Get-Setup($repo, $pattern, $target) {
            $release = Invoke-RestMethod -Headers $headers "https://api.github.com/repos/$repo/releases/latest"
            # Prefer an x64 (or universal) setup; fall back to any matching .exe.
            $candidates = $release.assets | Where-Object { $_.name -match $pattern }
            $asset = ($candidates | Where-Object { $_.name -match 'x64' } | Select-Object -First 1)
            if (-not $asset) { $asset = $candidates | Select-Object -First 1 }
            if (-not $asset) { throw "Geen installer gevonden in $repo $($release.tag_name) (zocht naar '$pattern')." }
            Write-Host "$repo $($release.tag_name): $($asset.name)"
            Invoke-WebRequest -Headers $headers $asset.browser_download_url -OutFile "build/drivers/$target"
            "$repo $($release.tag_name)" | Out-File -Append build/drivers/versions.txt
          }
          Get-Setup 'nefarius/ViGEmBus' '^ViGEmBus.*\.exe$' 'ViGEmBus_Setup.exe'
          Get-Setup 'nefarius/HidHide'  '^HidHide.*\.exe$' 'HidHide_Setup.exe'
          Get-Content build/drivers/versions.txt

      - name: Installeer Inno Setup
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup --no-progress -y }

      - name: Bouw installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          & $iscc installer/DS4Handler.iss `
            "/DAppVersion=${{ steps.version.outputs.version }}" `
            "/DSourceDir=$PWD\build\publish" `
            "/DDriverDir=$PWD\build\drivers" `
            "/DOutputDir=$PWD\build\dist"
          if ($LASTEXITCODE -ne 0) { throw "ISCC faalde ($LASTEXITCODE)" }
          Copy-Item build/publish/DS4Handler.exe "build/dist/DS4Handler-${{ steps.version.outputs.version }}-portable.exe"
          Get-ChildItem build/dist | Format-Table Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: DS4Handler-${{ steps.version.outputs.version }}
          path: build/dist/*.exe

      - name: Schrijf releasetekst
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
          REPO: ${{ github.repository }}
        run: |
          # "Nieuw in deze versie" = the top "## " section of CHANGELOG.md. The app reads this list
          # from the release to show what's new before updating.
          $notes = @()
          $inside = $false
          foreach ($line in Get-Content CHANGELOG.md -Encoding utf8) {
            if ($line -match '^\s{0,3}##\s') { if ($inside) { break }; $inside = $true; continue }
            if ($line -match '^\s{0,3}#\s') { if ($inside) { break }; continue }
            if ($inside) { $notes += $line }
          }
          $nieuw = ($notes -join "`n").Trim()
          if (-not $nieuw) { $nieuw = '- Verbeteringen en reparaties.' }
          $setup = "DS4Handler-Setup-$env:VERSION.exe"
          $body = @"
          ## Nieuw in deze versie

          $nieuw

          ## Downloaden

          **[$setup](https://github.com/$env:REPO/releases/download/$env:TAG/$setup)** is de makkelijkste keuze: download, dubbelklik en volg de stappen. De installer zet ook ViGEmBus en HidHide op je pc als die nog ontbreken. .NET hoef je niet apart te installeren. Heb je DS4 Handler al? Dan installeert de setup over de oude versie heen en blijven je profielen en instellingen bewaard. De app meldt zelf als er een update is.

          Liever zonder installatie? Neem ``DS4Handler-$env:VERSION-portable.exe`` en installeer [ViGEmBus](https://github.com/nefarius/ViGEmBus/releases) (en bij voorkeur [HidHide](https://github.com/nefarius/HidHide/releases)) zelf. De app waarschuwt bij het starten als een driver ontbreekt.

          Windows SmartScreen kan "Onbekende uitgever" tonen omdat de app niet ondertekend is. Klik dan op *Meer informatie* en *Toch uitvoeren*.
          "@
          Set-Content -Path build/release-body.md -Value $body -Encoding utf8
          Get-Content build/release-body.md

      - name: Maak GitHub-release
        if: steps.version.outputs.tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: DS4 Handler ${{ steps.version.outputs.version }}
          prerelease: ${{ contains(steps.version.outputs.version, '-') }}
          files: build/dist/*.exe
          body_path: build/release-body.md
          generate_release_notes: true
